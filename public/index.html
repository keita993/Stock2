<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>株式期待値分析ツール</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --border: #d9dee7;
      --blue: #1264d8;
      --red: #d92d20;
    }

    [data-theme="dark"] {
      --bg: #121417;
      --panel: #1d2127;
      --text: #edf1f7;
      --muted: #aab4c3;
      --border: #343b46;
      --blue: #6aa8ff;
      --red: #ff837a;
    }

    body {
      background: var(--bg);
      color: var(--text);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .muted {
      color: var(--muted);
    }

    .table {
      --bs-table-bg: var(--panel);
      --bs-table-color: var(--text);
      --bs-table-border-color: var(--border);
    }

    .value {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .positive,
    .expectation-high {
      color: var(--red);
      font-weight: 700;
    }

    .negative,
    .expectation-low {
      color: var(--blue);
      font-weight: 700;
    }

    .chart-wrap {
      height: 380px;
    }

    .table-wrap {
      max-height: 520px;
      overflow: auto;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
    }
  </style>
</head>
<body>
  <main class="container py-4">
    <header class="panel p-3 mb-3 d-flex flex-column flex-lg-row gap-3 justify-content-between align-items-lg-center">
      <div>
        <h1 class="h3 mb-1">株式期待値分析ツール</h1>
        <div class="muted">RSIとボリンジャーバンド下限乖離率で短期上昇期待値を算出</div>
      </div>
      <button id="themeToggle" class="btn btn-outline-secondary" type="button">ダークモード</button>
    </header>

    <section class="panel p-3 mb-3">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-lg-5">
          <label for="ticker" class="form-label">銘柄コード</label>
          <div class="input-group">
            <input id="ticker" class="form-control" value="1570" placeholder="例: 7203, 1570, AAPL" autocomplete="off">
            <button id="searchBtn" class="btn btn-primary" type="button">検索</button>
          </div>
        </div>
        <div class="col-6 col-lg-2">
          <label for="period" class="form-label">取得期間</label>
          <div class="input-group">
            <input id="period" class="form-control" type="number" value="730" min="30" max="3650">
            <span class="input-group-text">日</span>
          </div>
        </div>
        <div class="col-6 col-lg-2">
          <label for="shares" class="form-label">株数</label>
          <input id="shares" class="form-control" type="number" value="100" min="1">
        </div>
        <div class="col-12 col-lg-3">
          <button id="addPortfolioBtn" class="btn btn-outline-success w-100" type="button" disabled>ポートフォリオに追加</button>
        </div>
      </div>
      <div id="stockName" class="mt-3 fw-semibold"></div>
      <div id="error" class="alert alert-danger mt-3 d-none"></div>
    </section>

    <section id="portfolioSection" class="panel p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h5 mb-0">ポートフォリオ</h2>
        <button id="refreshPortfolioBtn" class="btn btn-sm btn-outline-secondary" type="button">更新</button>
      </div>
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead>
            <tr>
              <th>銘柄</th>
              <th>銘柄名</th>
              <th class="text-end">最新株価</th>
              <th class="text-end">期待値</th>
              <th class="text-end">操作</th>
            </tr>
          </thead>
          <tbody id="portfolioBody"></tbody>
        </table>
      </div>
    </section>

    <section id="stats" class="row g-3 mb-3 d-none">
      <div class="col-6 col-lg-3">
        <div class="panel p-3 h-100">
          <div class="muted">期待値 平均</div>
          <div id="avgExpectation" class="value">-</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="panel p-3 h-100">
          <div class="muted">期待値 Max</div>
          <div id="maxExpectation" class="value">-</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="panel p-3 h-100">
          <div class="muted">期待値 Min</div>
          <div id="minExpectation" class="value">-</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="panel p-3 h-100">
          <div class="muted">期間収益率</div>
          <div id="periodReturn" class="value">-</div>
        </div>
      </div>
    </section>

    <section class="panel p-3 mb-3 chart-wrap">
      <canvas id="stockChart"></canvas>
    </section>

    <section class="panel p-3 mb-3">
      <h2 class="h5 mb-3">バックテスト設定</h2>
      <div class="row g-3 align-items-end">
        <div class="col-6 col-lg-3">
          <label for="buyThreshold" class="form-label">買い閾値</label>
          <input id="buyThreshold" class="form-control" type="number" value="30">
        </div>
        <div class="col-6 col-lg-3">
          <label for="sellThreshold" class="form-label">売り閾値</label>
          <input id="sellThreshold" class="form-control" type="number" value="0">
        </div>
        <div class="col-6 col-lg-3">
          <div class="form-check mt-4">
            <input id="disableSell" class="form-check-input" type="checkbox">
            <label for="disableSell" class="form-check-label">売りなし</label>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <button id="backtestBtn" class="btn btn-primary w-100" type="button">バックテスト実行</button>
        </div>
      </div>
    </section>

    <section id="backtestResults" class="d-none">
      <div class="row g-3 mb-3">
        <div class="col-6 col-lg-3">
          <div class="panel p-3 h-100">
            <div class="muted">総取引回数</div>
            <div id="totalTrades" class="value">-</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="panel p-3 h-100">
            <div class="muted">勝率</div>
            <div id="winRate" class="value">-</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="panel p-3 h-100">
            <div class="muted">総利益率</div>
            <div id="totalProfitRate" class="value">-</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="panel p-3 h-100">
            <div class="muted">総利益金額</div>
            <div id="totalProfitAmount" class="value">-</div>
          </div>
        </div>
      </div>
      <div class="panel p-3 mb-3 table-wrap">
        <table class="table table-sm align-middle mb-0">
          <thead>
            <tr>
              <th>買付日</th>
              <th>売却日</th>
              <th class="text-end">買付価格</th>
              <th class="text-end">売却価格</th>
              <th class="text-end">買付期待値</th>
              <th class="text-end">売却期待値</th>
              <th class="text-end">利益率</th>
              <th class="text-end">利益金額</th>
            </tr>
          </thead>
          <tbody id="tradesBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel p-3 table-wrap">
      <table class="table table-sm align-middle mb-0">
        <thead>
          <tr>
            <th>日付</th>
            <th class="text-end">始値</th>
            <th class="text-end">高値</th>
            <th class="text-end">安値</th>
            <th class="text-end">終値</th>
            <th class="text-end">出来高</th>
            <th class="text-end">RSI</th>
            <th class="text-end">下限乖離率</th>
            <th class="text-end">短期上昇期待値</th>
          </tr>
        </thead>
        <tbody id="stockBody"></tbody>
      </table>
    </section>
  </main>

  <script>
    const portfolioKey = "stockPortfolio";
    let currentStock = null;
    let stockChart = null;

    const yen = new Intl.NumberFormat("ja-JP", { maximumFractionDigits: 1 });
    const pct = new Intl.NumberFormat("ja-JP", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    document.getElementById("searchBtn").addEventListener("click", () => loadStock());
    document.getElementById("backtestBtn").addEventListener("click", runBacktest);
    document.getElementById("addPortfolioBtn").addEventListener("click", addCurrentToPortfolio);
    document.getElementById("refreshPortfolioBtn").addEventListener("click", renderPortfolio);
    document.getElementById("ticker").addEventListener("keydown", (event) => {
      if (event.key === "Enter") loadStock();
    });
    document.getElementById("disableSell").addEventListener("change", (event) => {
      document.getElementById("sellThreshold").disabled = event.target.checked;
    });
    document.getElementById("themeToggle").addEventListener("click", toggleTheme);

    initTheme();
    renderPortfolio();

    async function loadStock(tickerOverride) {
      const ticker = tickerOverride || document.getElementById("ticker").value.trim();
      if (!ticker) {
        showError("銘柄コードを入力してください");
        return;
      }

      setBusy(true);
      clearError();
      document.getElementById("stockName").textContent = "";
      document.getElementById("backtestResults").classList.add("d-none");

      try {
        const data = await postJson("/api/stock", {
          ticker,
          period: Number(document.getElementById("period").value) || 730,
        });
        currentStock = data;
        document.getElementById("ticker").value = data.ticker.replace(".T", "");
        document.getElementById("stockName").textContent = data.stock_name;
        document.getElementById("addPortfolioBtn").disabled = false;
        renderStockData(data.stock_data);
      } catch (error) {
        showError(error.message);
      } finally {
        setBusy(false);
      }
    }

    async function runBacktest() {
      const ticker = document.getElementById("ticker").value.trim();
      if (!ticker) {
        showError("銘柄コードを入力してください");
        return;
      }

      setBusy(true);
      clearError();

      try {
        const data = await postJson("/api/backtest", {
          ticker,
          period: Number(document.getElementById("period").value) || 730,
          buy_threshold: Number(document.getElementById("buyThreshold").value),
          sell_threshold: Number(document.getElementById("sellThreshold").value),
          disable_sell: document.getElementById("disableSell").checked,
          shares: Number(document.getElementById("shares").value) || 100,
        });
        currentStock = data;
        document.getElementById("stockName").textContent = data.stock_name;
        document.getElementById("addPortfolioBtn").disabled = false;
        renderStockData(data.stock_data, data.trades);
        renderBacktest(data);
      } catch (error) {
        showError(error.message);
      } finally {
        setBusy(false);
      }
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await response.json();
      if (!response.ok || data.error) {
        throw new Error(data.error || `HTTP ${response.status}`);
      }
      return data;
    }

    function renderStockData(rows, trades = []) {
      const body = document.getElementById("stockBody");
      body.innerHTML = rows.map((row) => `
        <tr>
          <td>${row.date}</td>
          <td class="text-end">${yen.format(row.open)}</td>
          <td class="text-end">${yen.format(row.high)}</td>
          <td class="text-end">${yen.format(row.low)}</td>
          <td class="text-end">${yen.format(row.close)}</td>
          <td class="text-end">${Number(row.volume).toLocaleString("ja-JP")}</td>
          <td class="text-end">${formatOptional(row.rsi)}</td>
          <td class="text-end">${formatOptional(row.lower_deviation)}</td>
          <td class="text-end ${expectationClass(row.short_term_expectation)}">${formatOptional(row.short_term_expectation)}</td>
        </tr>
      `).join("");

      const valid = rows.map((row) => row.short_term_expectation).filter((value) => value !== null);
      if (valid.length > 0) {
        document.getElementById("avgExpectation").textContent = pct.format(valid.reduce((sum, value) => sum + value, 0) / valid.length);
        document.getElementById("maxExpectation").textContent = pct.format(Math.max(...valid));
        document.getElementById("minExpectation").textContent = pct.format(Math.min(...valid));
        const newest = rows[0].close;
        const oldest = rows[rows.length - 1].close;
        document.getElementById("periodReturn").textContent = `${pct.format(((newest - oldest) / oldest) * 100)}%`;
        document.getElementById("stats").classList.remove("d-none");
      }

      renderChart(rows, trades);
    }

    function renderChart(rows, trades) {
      const sorted = [...rows].sort((a, b) => a.date.localeCompare(b.date));
      const buyPoints = trades.map((trade) => ({ x: trade.buy_date, y: trade.buy_price }));
      const sellPoints = trades.map((trade) => ({ x: trade.sell_date, y: trade.sell_price }));
      const context = document.getElementById("stockChart");

      if (stockChart) stockChart.destroy();
      stockChart = new Chart(context, {
        type: "line",
        data: {
          labels: sorted.map((row) => row.date),
          datasets: [
            {
              label: "終値",
              data: sorted.map((row) => row.close),
              borderColor: "#1570d8",
              backgroundColor: "rgba(21, 112, 216, 0.08)",
              pointRadius: 0,
              tension: 0.18,
            },
            {
              label: "買い",
              data: buyPoints,
              borderColor: "#1570d8",
              backgroundColor: "#1570d8",
              pointStyle: "triangle",
              pointRadius: 6,
              showLine: false,
            },
            {
              label: "売り",
              data: sellPoints,
              borderColor: "#d92d20",
              backgroundColor: "#d92d20",
              pointStyle: "triangle",
              rotation: 180,
              pointRadius: 6,
              showLine: false,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { ticks: { maxTicksLimit: 8 } },
            y: { beginAtZero: false },
          },
        },
      });
    }

    function renderBacktest(data) {
      const performance = data.performance;
      document.getElementById("totalTrades").textContent = performance.total_trades;
      document.getElementById("winRate").textContent = `${pct.format(performance.win_rate)}%`;
      document.getElementById("totalProfitRate").textContent = `${pct.format(performance.total_profit_rate)}%`;
      document.getElementById("totalProfitAmount").textContent = `${Math.round(performance.total_profit_amount).toLocaleString("ja-JP")}円`;
      document.getElementById("tradesBody").innerHTML = data.trades
        .slice()
        .sort((a, b) => b.buy_date.localeCompare(a.buy_date))
        .map((trade) => `
          <tr>
            <td>${trade.buy_date}</td>
            <td>${trade.sell_date}</td>
            <td class="text-end">${yen.format(trade.buy_price)}</td>
            <td class="text-end">${yen.format(trade.sell_price)}</td>
            <td class="text-end">${formatOptional(trade.buy_expectation)}</td>
            <td class="text-end">${formatOptional(trade.sell_expectation)}</td>
            <td class="text-end ${trade.profit_rate >= 0 ? "positive" : "negative"}">${pct.format(trade.profit_rate)}%</td>
            <td class="text-end ${trade.profit_amount >= 0 ? "positive" : "negative"}">${Math.round(trade.profit_amount).toLocaleString("ja-JP")}円</td>
          </tr>
        `).join("");
      document.getElementById("backtestResults").classList.remove("d-none");
    }

    function getPortfolio() {
      return JSON.parse(localStorage.getItem(portfolioKey) || "[]");
    }

    function savePortfolio(portfolio) {
      localStorage.setItem(portfolioKey, JSON.stringify(portfolio));
    }

    function addCurrentToPortfolio() {
      if (!currentStock?.stock_data?.length) return;
      const portfolio = getPortfolio();
      const ticker = currentStock.ticker;
      if (portfolio.some((item) => item.ticker === ticker)) return;

      const latest = currentStock.stock_data[0];
      portfolio.push({
        ticker,
        name: currentStock.stock_name,
        latest_price: latest.close,
        short_term_expectation: latest.short_term_expectation,
      });
      savePortfolio(portfolio);
      renderPortfolio();
    }

    async function renderPortfolio() {
      const body = document.getElementById("portfolioBody");
      const portfolio = getPortfolio();
      if (portfolio.length === 0) {
        body.innerHTML = `<tr><td colspan="5" class="text-center muted">ポートフォリオが空です</td></tr>`;
        return;
      }

      body.innerHTML = portfolio.map((item) => rowPortfolio(item)).join("");
      const refreshed = await Promise.all(portfolio.map(async (item) => {
        try {
          const data = await postJson("/api/stock", { ticker: item.ticker, period: 60 });
          const latest = data.stock_data[0];
          return {
            ticker: data.ticker,
            name: data.stock_name,
            latest_price: latest.close,
            short_term_expectation: latest.short_term_expectation,
          };
        } catch {
          return item;
        }
      }));
      savePortfolio(refreshed);
      body.innerHTML = refreshed.map((item) => rowPortfolio(item)).join("");
    }

    function rowPortfolio(item) {
      return `
        <tr>
          <td>${item.ticker.replace(".T", "")}</td>
          <td>${item.name || item.ticker}</td>
          <td class="text-end">${item.latest_price ? `${yen.format(item.latest_price)}円` : "-"}</td>
          <td class="text-end ${expectationClass(item.short_term_expectation)}">${formatOptional(item.short_term_expectation)}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary" type="button" onclick="loadStock('${item.ticker}')">表示</button>
            <button class="btn btn-sm btn-outline-danger" type="button" onclick="removePortfolio('${item.ticker}')">削除</button>
          </td>
        </tr>
      `;
    }

    function removePortfolio(ticker) {
      savePortfolio(getPortfolio().filter((item) => item.ticker !== ticker));
      renderPortfolio();
    }

    function expectationClass(value) {
      if (value === null || value === undefined || Number.isNaN(value)) return "";
      if (value >= 30) return "expectation-high";
      if (value <= 0) return "expectation-low";
      return "";
    }

    function formatOptional(value) {
      return value === null || value === undefined || Number.isNaN(value) ? "-" : pct.format(value);
    }

    function showError(message) {
      const error = document.getElementById("error");
      error.textContent = message;
      error.classList.remove("d-none");
    }

    function clearError() {
      document.getElementById("error").classList.add("d-none");
    }

    function setBusy(isBusy) {
      document.getElementById("searchBtn").disabled = isBusy;
      document.getElementById("backtestBtn").disabled = isBusy;
      document.getElementById("searchBtn").textContent = isBusy ? "取得中..." : "検索";
    }

    function initTheme() {
      const theme = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
      document.getElementById("themeToggle").textContent = theme === "dark" ? "ライトモード" : "ダークモード";
    }

    function toggleTheme() {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      localStorage.setItem("theme", next);
      initTheme();
    }
  </script>
</body>
</html>
